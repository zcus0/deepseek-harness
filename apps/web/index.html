<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DSH Local Build</title>
    <script>
      // crypto.randomUUID only exists in secure contexts (HTTPS/localhost);
      // this GUI is also served over plain http://<LAN-IP>, so polyfill it.
      // Must run before the app module graph loads.
      if (typeof crypto.randomUUID !== 'function' && typeof crypto.getRandomValues === 'function') {
        Object.defineProperty(crypto, 'randomUUID', {
          value: function () {
            return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
              var x = Number(c)
              return (x ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (x / 4)))).toString(16)
            })
          },
          configurable: true,
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
